<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Platformer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d1a; overflow: hidden; }
  #unity-canvas { width: 100%; height: 100%; display: block; background: #0b0d1a; outline: none; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 12px; color: #cfd3ff; font: 14px system-ui, sans-serif; }
  #bar { width: 60%; max-width: 320px; height: 8px; background: #23264a; border-radius: 99px; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #4fc79a; transition: width .2s; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><div>กำลังโหลดเกม…</div><div id="bar"><div id="fill"></div></div></div>
<script>
  // Arrow keys / Space must not scroll the parent portfolio page
  window.addEventListener("keydown", function (e) {
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) e.preventDefault();
  });
  var canvas = document.querySelector("#unity-canvas");
  var script = document.createElement("script");
  script.src = "Build/WebGL.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, {
      dataUrl: "Build/WebGL.data",
      frameworkUrl: "Build/WebGL.framework.js",
      codeUrl: "Build/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "SpaceGame",
      productName: "RobloxPlatformer",
      productVersion: "1.0"
    }, function (p) {
      document.querySelector("#fill").style.width = (100 * p) + "%";
    }).then(function () {
      document.querySelector("#loading").remove();
      canvas.focus();
    }).catch(function (msg) {
      document.querySelector("#loading").textContent = "โหลดเกมไม่สำเร็จ: " + msg;
    });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
